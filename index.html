<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Crime World</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="game"></div>


  <!-- HUD -->

  <div class="hud">

    <div class="game-logo">
      <span>CRIME</span>
      <strong>WORLD</strong>
    </div>

    <div class="wanted">
      <span>WANTED</span>

      <div class="stars">
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>
    </div>

    <div class="money">
      <small>CASH</small>
      <strong>$0</strong>
    </div>

  </div>


  <!-- PLAYER STATUS -->

  <div class="player-status">

    <div class="health-bar">
      <div id="healthFill"></div>
    </div>

    <div class="armor-bar">
      <div id="armorFill"></div>
    </div>

  </div>


  <!-- MISSION -->

  <div class="mission-box">

    <small>MISSION</small>

    <strong id="missionTitle">
      Welcome to the City
    </strong>

    <p id="missionText">
      Explore the city.
    </p>

  </div>


  <!-- JOYSTICK -->

  <div
    class="joystick"
    id="joystick"
  >

    <div
      class="joystick-knob"
      id="joystickKnob"
    ></div>

  </div>


  <!-- GAME CONTROLS -->

  <div class="controls">

    <button
      type="button"
      class="control-button"
      id="jumpButton"
    >
      JUMP
    </button>

    <button
      type="button"
      class="control-button run"
      id="runButton"
    >
      RUN
    </button>

    <button
      type="button"
      class="control-button action"
      id="actionButton"
    >
      ACTION
    </button>

  </div>


  <!-- CAMERA TOUCH AREA -->

  <div
    id="cameraTouchArea"
  ></div>


  <!-- LOADING SCREEN -->

  <div id="loadingScreen">

    <div class="loading-content">

      <div class="loading-logo">
        CRIME
        <strong>WORLD</strong>
      </div>

      <div id="loadingText">
        Loading...
      </div>

      <div class="loading-bar">

        <div id="loadingFill"></div>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="./game.js"
  ></script>

</body>
</html>
