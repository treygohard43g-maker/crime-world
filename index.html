<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Crime World</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

/* ---------------- HUD ---------------- */

#hud{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    z-index:20;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hudBox{
    background:rgba(10,10,15,.72);
    color:white;

    padding:10px 14px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(10px);

    font-size:14px;
}

.money{
    color:#55e68a;
    font-weight:bold;
}

.wanted{
    color:#ffd43b;
}

/* ---------------- JOYSTICK ---------------- */

#joystick{
    position:fixed;

    left:25px;
    bottom:28px;

    width:130px;
    height:130px;

    border-radius:50%;

    background:rgba(255,255,255,.10);

    border:
        2px solid
        rgba(255,255,255,.22);

    z-index:30;

    touch-action:none;
}

#stick{
    position:absolute;

    width:58px;
    height:58px;

    left:34px;
    top:34px;

    border-radius:50%;

    background:
        rgba(255,255,255,.72);

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.35);
}

/* ---------------- ACTION BUTTONS ---------------- */

#buttons{
    position:fixed;

    right:22px;
    bottom:30px;

    display:flex;

    gap:12px;

    z-index:30;
}

.action{
    width:62px;
    height:62px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(10,10,15,.72);

    color:white;

    font-size:25px;
}

.action:active{
    transform:scale(.92);
}

/* ---------------- LOCATION ---------------- */

#location{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    background:
        rgba(0,0,0,.55);

    color:white;

    padding:7px 12px;

    border-radius:20px;

    font-size:12px;

    z-index:20;

    pointer-events:none;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="hudBox">
        CRIME WORLD
    </div>

    <div class="hudBox">
        <span class="money">$2,500</span>
        &nbsp;&nbsp;
        <span class="wanted">★☆☆☆☆</span>
    </div>

</div>

<div id="location">
    Downtown
</div>

<div id="joystick">

    <div id="stick"></div>

</div>

<div id="buttons">

    <button class="action">
        🚗
    </button>

    <button class="action">
        🏃
    </button>

    <button class="action">
        🎯
    </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   BASIC THREE.JS SETUP
===================================================== */

const canvas =
    document.getElementById("game");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8fcdf1);

scene.fog =
    new THREE.Fog(
        0x8fcdf1,
        80,
        300
    );


const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        .1,
        500
    );


const renderer =
    new THREE.WebGLRenderer({

        canvas:canvas,

        antialias:true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.3
    );

sun.position.set(
    80,
    120,
    60
);

scene.add(sun);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        .55
    );

scene.add(ambient);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            400,
            400
        ),

        new THREE.MeshStandardMaterial({
            color:0x4f9c55
        })

    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =====================================================
   ROAD FUNCTION
===================================================== */

function road(
    x,
    z,
    width,
    depth
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .08,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color:0x303238
            })

        );

    mesh.position.set(
        x,
        .04,
        z
    );

    scene.add(mesh);

}


/* =====================================================
   CITY ROADS
===================================================== */

road(
    0,
    0,
    400,
    22
);

road(
    0,
    80,
    400,
    20
);

road(
    0,
    -80,
    400,
    20
);

road(
    80,
    0,
    20,
    400
);

road(
    -80,
    0,
    20,
    400
);


/* =====================================================
   ROAD LINES
===================================================== */

function roadLine(
    x,
    z,
    horizontal
){

    const geometry =
        horizontal
        ?
        new THREE.BoxGeometry(
            7,
            .03,
            .3
        )
        :
        new THREE.BoxGeometry(
            .3,
            .03,
            7
        );

    const line =
        new THREE.Mesh(

            geometry,

            new THREE.MeshBasicMaterial({
                color:0xffffff
            })

        );

    line.position.set(
        x,
        .10,
        z
    );

    scene.add(line);

}


for(
    let x=-190;
    x<190;
    x+=15
){

    roadLine(
        x,
        0,
        true
    );

    roadLine(
        x,
        80,
        true
    );

    roadLine(
        x,
        -80,
        true
    );

}


for(
    let z=-190;
    z<190;
    z+=15
){

    roadLine(
        0,
        z,
        false
    );

    roadLine(
        80,
        z,
        false
    );

    roadLine(
        -80,
        z,
        false
    );

}


/* =====================================================
   BUILDINGS
===================================================== */

function building(
    x,
    z,
    width,
    height,
    depth
){

    const colors=[
        0x9a7565,
        0x727985,
        0xb58b64,
        0x626b75,
        0x846a5d,
        0x9d9d91
    ];

    const material =
        new THREE.MeshStandardMaterial({

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]

        });


    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    mesh.position.set(
        x,
        height/2,
        z
    );


    scene.add(mesh);


    /* windows */

    for(
        let y=3;
        y<height-2;
        y+=4
    ){

        const windowMesh =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1.2,
                    1.2,
                    .08
                ),

                new THREE.MeshBasicMaterial({
                    color:0xdce8a5
                })

            );


        windowMesh.position.set(
            x,
            y,
            z-depth/2-.05
        );


        scene.add(windowMesh);

    }

}


/* City blocks */

building(
    -125,
    -125,
    45,
    25,
    45
);

building(
    -125,
    -35,
    50,
    32,
    45
);

building(
    -125,
    125,
    45,
    28,
    45
);


building(
    -35,
    -125,
    42,
    22,
    45
);

building(
    -35,
    125,
    48,
    35,
    45
);


building(
    125,
    -125,
    48,
    40,
    45
);

building(
    125,
    -35,
    45,
    25,
    45
);

building(
    125,
    125,
    50,
    30,
    45
);


/* =====================================================
   TREES
===================================================== */

function tree(
    x,
    z
){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35,
                .45,
                3
            ),

            new THREE.MeshStandardMaterial({
                color:0x70462b
            })

        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.2,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color:0x23733a
            })

        );

    leaves.position.set(
        x,
        4,
        z
    );

    scene.add(leaves);

}


/* trees around streets */

const treePositions=[
    [-25,30],
    [25,30],
    [-25,-30],
    [25,-30],
    [30,105],
    [-30,105],
    [105,30],
    [105,-30],
    [-105,30],
    [-105,-30]
];


treePositions.forEach(
    p=>tree(p[0],p[1])
);


/* =====================================================
   STREET LIGHTS
===================================================== */

function streetLight(
    x,
    z
){

    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .12,
                .12,
                5
            ),

            new THREE.MeshStandardMaterial({
                color:0x222222
            })

        );

    pole.position.set(
        x,
        2.5,
        z
    );

    scene.add(pole);


    const lamp =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .35,
                10,
                10
            ),

            new THREE.MeshBasicMaterial({
                color:0xffffcc
            })

        );

    lamp.position.set(
        x,
        5,
        z
    );

    scene.add(lamp);

}


streetLight(
    -12,
    12
);

streetLight(
    12,
    12
);

streetLight(
    -12,
    -12
);

streetLight(
    12,
    -12
);


/* =====================================================
   CAR
===================================================== */

function createCar(
    x,
    z,
    color
){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                3.4,
                .8,
                6
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    body.position.y=.8;

    car.add(body);


    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.5,
                .8,
                2.8
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    roof.position.y=1.5;

    car.add(roof);


    /* wheels */

    const wheelGeometry =
        new THREE.CylinderGeometry(
            .55,
            .55,
            .35,
            16
        );


    for(
        const wx of [-1.6,1.6]
    ){

        for(
            const wz of [-2,2]
        ){

            const wheel =
                new THREE.Mesh(

                    wheelGeometry,

                    new THREE.MeshStandardMaterial({
                        color:0x151515
                    })

                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                wx,
                .55,
                wz
            );

            car.add(wheel);

        }

    }


    car.position.set(
        x,
        0,
        z
    );


    scene.add(car);

}


createCar(
    30,
    5,
    0xd93636
);

createCar(
    -30,
    -5,
    0x286bd6
);

createCar(
    5,
    30,
    0xf2c230
);


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Group();


/* body */

const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.3,
            2,
            .8
        ),

        new THREE.MeshStandardMaterial({
            color:0x2457c5
        })

    );

body.position.y=1.5;

player.add(body);


/* head */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .55,
            16,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0xc98d68
        })

    );

head.position.y=3;

player.add(head);


/* legs */

function limb(
    x,
    y,
    z,
    color
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .4,
                1.3,
                .45
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    mesh.position.set(
        x,
        y,
        z
    );

    player.add(mesh);

}


limb(
    -.35,
    .45,
    0,
    0x182c65
);

limb(
    .35,
    .45,
    0,
    0x182c65
);


/* arms */

function arm(
    x
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .4,
                1.5,
                .45
            ),

            new THREE.MeshStandardMaterial({
                color:0x2457c5
            })

        );

    mesh.position.set(
        x,
        1.5,
        0
    );

    player.add(mesh);

}


arm(-.95);
arm(.95);


player.position.set(
    0,
    0,
    25
);


scene.add(player);


/* =====================================================
   CAMERA
===================================================== */

camera.position.set(
    0,
    6,
    10
);


/* =====================================================
   MOVEMENT
===================================================== */

let moveX=0;
let moveZ=0;


function updatePlayer(){

    const speed=.18;

    player.position.x +=
        moveX*speed;

    player.position.z +=
        moveZ*speed;


    if(
        moveX !== 0 ||
        moveZ !== 0
    ){

        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );

    }


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -180,
            180
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -180,
            180
        );

}


/* =====================================================
   CAMERA FOLLOW
===================================================== */

function updateCamera(){

    const behind =
        new THREE.Vector3(
            0,
            5.8,
            9
        );


    behind.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        player.rotation.y
    );


    const target =
        player.position.clone()
        .add(behind);


    camera.position.lerp(
        target,
        .08
    );


    camera.lookAt(
        player.position.x,
        1.7,
        player.position.z
    );

}


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickActive=false;


joystick.addEventListener(
    "touchstart",
    e=>{

        joystickActive=true;

        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        if(!joystickActive)
            return;


        const touch =
            e.touches[0];


        const rect =
            joystick.getBoundingClientRect();


        const centerX =
            rect.left+
            rect.width/2;


        const centerY =
            rect.top+
            rect.height/2;


        let dx =
            touch.clientX-
            centerX;


        let dy =
            touch.clientY-
            centerY;


        const max=38;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(
            distance>max
        ){

            dx =
                dx/distance*max;

            dy =
                dy/distance*max;

        }


        stick.style.transform=
            `translate(${dx}px,${dy}px)`;


        moveX=
            dx/max;

        moveZ=
            dy/max;


        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    ()=>{

        joystickActive=false;

        moveX=0;
        moveZ=0;

        stick.style.transform=
            "translate(0,0)";

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
