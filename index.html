<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Crime World</title>

  <link rel="stylesheet" href="style.css">

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>

</head>


<body>

  <div id="game"></div>


  <!-- =====================================================
       HUD
  ====================================================== -->

  <div id="hud">

    <div class="top-bar">

      <div class="game-logo">
        CRIME WORLD
      </div>

      <div class="wanted">
        ★★★★★
      </div>

      <div class="cash">
        $0
      </div>

    </div>


    <div class="player-status">

      <div class="status-bar health">

        <span>HEALTH</span>

        <div class="bar">
          <div
            id="healthFill"
            class="fill"
          ></div>
        </div>

      </div>


      <div class="status-bar armor">

        <span>ARMOR</span>

        <div class="bar">
          <div
            id="armorFill"
            class="fill"
          ></div>
        </div>

      </div>

    </div>


    <div id="missionBox">

      <div id="missionTitle">
        Welcome to the City
      </div>

      <div id="missionText">
        Explore the city.
      </div>

    </div>

  </div>


  <!-- =====================================================
       MOBILE CONTROLS
  ====================================================== -->

  <div id="joystick">

    <div id="joystickKnob"></div>

  </div>


  <button id="runButton">
    RUN
  </button>


  <button id="jumpButton">
    JUMP
  </button>


  <button id="actionButton">
    ACTION
  </button>


  <div id="cameraTouchArea"></div>


  <!-- =====================================================
       LOADING SCREEN
  ====================================================== -->

  <div id="loadingScreen">

    <div class="loading-content">

      <div class="loading-title">
        CRIME WORLD
      </div>

      <div
        id="loadingText"
        class="loading-text"
      >
        Loading...
      </div>

      <div class="loading-bar">

        <div
          id="loadingFill"
          class="loading-fill"
        ></div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       GAME
  ====================================================== -->

  <script
    type="module"
    src="./game.js"
  ></script>


  <!-- Loading failsafe -->
  <script>

    window.addEventListener(
      "load",
      () => {

        setTimeout(
          () => {

            const loading =
              document.getElementById(
                "loadingScreen"
              );

            if (loading) {

              loading.classList.add(
                "hidden"
              );

            }

          },
          5000
        );

      }
    );

  </script>

</body>

</html>
