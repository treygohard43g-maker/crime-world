<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Crime World</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GAME -->
  <div id="game"></div>

  <!-- TOP HUD -->
  <div class="hud">

    <div class="game-logo">
      <span>CRIME</span>
      <strong>WORLD</strong>
    </div>

    <div class="wanted">
      <span id="wantedText">WANTED</span>

      <div class="stars">
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>
    </div>

    <div class="money">
      <small>CASH</small>
      <strong>$2,500</strong>
    </div>

  </div>

  <!-- PLAYER STATUS -->
  <div class="player-status">

    <div class="health-bar">
      <div id="healthFill"></div>
    </div>

    <div class="armor-bar">
      <div id="armorFill"></div>
    </div>

  </div>

  <!-- MISSION -->
  <div class="mission-box">
    <small>MISSION</small>
    <strong id="missionTitle">Welcome to the City</strong>
    <p id="missionText">
      Explore the city.
    </p>
  </div>

  <!-- LEFT JOYSTICK -->
  <div id="joystick" class="joystick">
    <div id="joystickKnob" class="joystick-knob"></div>
  </div>

  <!-- RIGHT CONTROLS -->
  <div class="controls">

    <button id="runButton" class="control-button run">
      RUN
    </button>

    <button id="jumpButton" class="control-button">
      JUMP
    </button>

    <button id="actionButton" class="control-button action">
      ACTION
    </button>

  </div>

  <!-- CAMERA AREA -->
  <div id="cameraTouchArea"></div>

  <!-- LOADING -->
  <div id="loadingScreen">

    <div class="loading-content">

      <div class="loading-logo">
        CRIME
        <strong>WORLD</strong>
      </div>

      <div class="loading-bar">
        <div id="loadingFill"></div>
      </div>

      <p id="loadingText">Loading city...</p>

    </div>

  </div>

  <!-- THREE.JS GAME -->
  <script type="module" src="game.js"></script>

</body>
</html>
