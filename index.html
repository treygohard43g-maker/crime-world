<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Crime World</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top HUD */
    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .money {
      color: #55e68a;
      font-weight: bold;
    }

    /* Joystick */
    #joystick {
      position: fixed;
      left: 25px;
      bottom: 30px;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      border: 2px solid rgba(255,255,255,0.25);
      z-index: 20;
      touch-action: none;
    }

    #stick {
      position: absolute;
      width: 55px;
      height: 55px;
      left: 33px;
      top: 33px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    /* Action buttons */
    #buttons {
      position: fixed;
      right: 22px;
      bottom: 30px;
      display: flex;
      gap: 14px;
      z-index: 20;
    }

    .action {
      width: 62px;
      height: 62px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 24px;
      border: 1px solid rgba(255,255,255,0.25);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="loading">
    Loading Crime World...
  </div>

  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box">
      Crime World
    </div>

    <div class="hud-box">
      <span class="money">$2,500</span>
    </div>
  </div>

  <!-- Mobile joystick -->
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <!-- Action buttons -->
  <div id="buttons">
    <button class="action">🚗</button>
    <button class="action">🏃</button>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const canvas = document.getElementById("game");

    /* =========================
       THREE.JS WORLD
    ========================= */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    /* Camera */
    const camera = new THREE.PerspectiveCamera(
      65,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    /* Renderer */
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    /* =========================
       LIGHTING
    ========================= */

    const sunlight = new THREE.DirectionalLight(
      0xffffff,
      1
    );

    sunlight.position.set(20, 40, 20);
    scene.add(sunlight);

    const ambient = new THREE.AmbientLight(
      0xffffff,
      0.55
    );

    scene.add(ambient);

    /* =========================
       GROUND
    ========================= */

    const groundGeometry =
      new THREE.PlaneGeometry(300, 300);

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x4b9b52
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.rotation.x = -Math.PI / 2;

    scene.add(ground);

    /* =========================
       ROADS
    ========================= */

    function createRoad(
      x,
      z,
      width,
      depth
    ) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          0.08,
          depth
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x333338
        });

      const road =
        new THREE.Mesh(
          geometry,
          material
        );

      road.position.set(
        x,
        0.04,
        z
      );

      scene.add(road);
    }

    createRoad(0, 0, 300, 22);
    createRoad(0, 0, 22, 300);

    createRoad(0, 55, 300, 18);
    createRoad(55, 0, 18, 300);

    /* =========================
       BUILDINGS
    ========================= */

    function createBuilding(
      x,
      z,
      width,
      height,
      depth
    ) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          height,
          depth
        );

      const colors = [
        0xb86f52,
        0x777f8f,
        0xc4a46b,
        0x596b7a,
        0x8b6b61
      ];

      const material =
        new THREE.MeshStandardMaterial({
          color:
            colors[
              Math.floor(
                Math.random() * colors.length
              )
            ]
        });

      const building =
        new THREE.Mesh(
          geometry,
          material
        );

      building.position.set(
        x,
        height / 2,
        z
      );

      scene.add(building);
    }

    /* City blocks */

    createBuilding(-55, -55, 35, 22, 35);
    createBuilding(-105, -55, 30, 30, 35);

    createBuilding(55, -55, 40, 28, 35);
    createBuilding(105, -55, 30, 20, 35);

    createBuilding(-55, 55, 35, 25, 35);
    createBuilding(-105, 55, 30, 18, 35);

    createBuilding(55, 55, 40, 32, 35);
    createBuilding(105, 55, 30, 24, 35);

    /* =========================
       PLAYER
    ========================= */

    const player =
      new THREE.Group();

    /* Body */

    const bodyGeometry =
      new THREE.BoxGeometry(
        1.4,
        2.3,
        0.8
      );

    const bodyMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x2266cc
      });

    const body =
      new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
      );

    body.position.y = 1.4;

    player.add(body);

    /* Head */

    const headGeometry =
      new THREE.SphereGeometry(
        0.55,
        16,
        16
      );

    const headMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xc98f68
      });

    const head =
      new THREE.Mesh(
        headGeometry,
        headMaterial
      );

    head.position.y = 3;

    player.add(head);

    player.position.set(
      0,
      0,
      20
    );

    scene.add(player);

    /* =========================
       CAMERA
    ========================= */

    camera.position.set(
      0,
      7,
      10
    );

    /* =========================
       MOVEMENT
    ========================= */

    let moveX = 0;
    let moveZ = 0;

    function updatePlayer() {

      const speed = 0.18;

      player.position.x += moveX * speed;
      player.position.z += moveZ * speed;

      /* Keep player inside world */

      player.position.x =
        Math.max(
          -140,
          Math.min(
            140,
            player.position.x
          )
        );

      player.position.z =
        Math.max(
          -140,
          Math.min(
            140,
            player.position.z
          )
        );
    }

    /* =========================
       CAMERA FOLLOW
    ========================= */

    function updateCamera() {

      const targetX =
        player.position.x;

      const targetZ =
        player.position.z + 9;

      camera.position.x +=
        (targetX - camera.position.x) * 0.08;

      camera.position.z +=
        (targetZ - camera.position.z) * 0.08;

      camera.position.y = 6;

      camera.lookAt(
        player.position.x,
        1.5,
        player.position.z
      );
    }

    /* =========================
       JOYSTICK
    ========================= */

    const joystick =
      document.getElementById("joystick");

    const stick =
      document.getElementById("stick");

    let joystickActive = false;

    joystick.addEventListener(
      "touchstart",
      function(event) {

        joystickActive = true;

        event.preventDefault();
      },
      { passive: false }
    );

    joystick.addEventListener(
      "touchmove",
      function(event) {

        if (!joystickActive) return;

        const touch =
          event.touches[0];

        const rect =
          joystick.getBoundingClientRect();

        const centerX =
          rect.left + rect.width / 2;

        const centerY =
          rect.top + rect.height / 2;

        let dx =
          touch.clientX - centerX;

        let dy =
          touch.clientY - centerY;

        const maxDistance = 35;

        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );

        if (distance > maxDistance) {

          dx =
            dx / distance *
            maxDistance;

          dy =
            dy / distance *
            maxDistance;
        }

        stick.style.transform =
          `translate(${dx}px, ${dy}px)`;

        moveX =
          dx / maxDistance;

        moveZ =
          dy / maxDistance;

        event.preventDefault();

      },
      { passive: false }
    );

    joystick.addEventListener(
      "touchend",
      function() {

        joystickActive = false;

        moveX = 0;
        moveZ = 0;

        stick.style.transform =
          "translate(0px, 0px)";
      }
    );

    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );

    /* =========================
       GAME LOOP
    ========================= */

    function gameLoop() {

      requestAnimationFrame(gameLoop);

      updatePlayer();

      updateCamera();

      renderer.render(
        scene,
        camera
      );
    }

    /* Start */

    document.getElementById(
      "loading"
    ).style.display = "none";

    gameLoop();

  </script>

</body>
</html>
